<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>个人资源导航</title>
<link rel="stylesheet" href="https://unpkg.com/lucide@latest/font/lucide.min.css"/>
<style>
:root{
  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --success:#10b981;
  --bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --card:#ffffff;
  --text:#111827;
  --text-light:#6b7280;
  --radius:8px;
  --shadow:0 6px 20px rgba(0,0,0,.08);
}
body.dark{
  --card:#1f2937;
  --text:#f3f4f6;
  --text-light:#9ca3af;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg) fixed;
  color:var(--text);
  line-height:1.6;
  opacity:0;
  transition:opacity .4s;
}
header{
  padding:50px 20px 30px;
  text-align:center;
  position:relative;
}
header h1{
  font-size:2.2rem;
  color:#fff;
  font-weight:700;
  letter-spacing:1px;
}
#themeToggle{
  position:absolute;
  right:20px;
  top:20px;
  background:rgba(255,255,255,.15);
  border:0;
  border-radius:50%;
  width:40px;
  height:40px;
  color:#fff;
  cursor:pointer;
  font-size:20px;
}
#searchBox{
  max-width:400px;
  margin:0 auto 30px;
  display:block;
  padding:10px 16px;
  border-radius:var(--radius);
  border:0;
  font-size:1rem;
  width:90%;
  box-shadow:var(--shadow);
}
main{
  max-width:900px;
  margin:0 auto;
  padding:0 20px 40px;
}
.section-grid{
  display:grid;
  gap:24px;
}
section{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
  transition:transform .2s;
}
section:hover{
  transform:translateY(-2px);
}
h2{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:1.25rem;
  margin-bottom:12px;
}
.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:8px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:var(--radius);
  font-size:.9rem;
  font-weight:500;
  text-decoration:none;
  color:#fff;
  border:0;
  cursor:pointer;
  transition:background .2s;
}
.btn.primary{
  background:var(--primary);
}
.btn.primary:hover{
  background:var(--primary-dark);
}
.btn.copy{
  background:var(--success);
}
.btn.secondary{
  background:var(--text-light);
}
summary{
  cursor:pointer;
  user-select:none;
  margin-top:10px;
  font-size:.9rem;
  color:var(--text-light);
}
footer{
  text-align:center;
  padding:30px 10px;
  font-size:.8rem;
  color:rgba(255,255,255,.7);
}
/* toast */
#toast{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--card);
  padding:14px 20px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:10px;
  transform:translateX(120%);
  transition:transform .3s;
  z-index:999;
}
#toast.show{
  transform:translateX(0);
}
@media(max-width:600px){
  header h1{font-size:1.6rem}
}
</style>
</head>
<body>
<header>
  <button id="themeToggle" aria-label="切换主题">☾</button>
  <h1>个人资源导航</h1>
  <input id="searchBox" placeholder="搜索名称或关键词…" autocomplete="off"/>
</header>

  <!-- 去广告规则 -->

  <!-- 油猴脚本 -->
  <section>
    <h2><i data-lucide="codesandbox"></i> 油猴脚本</h2>

      <a class="btn primary" href="https://github.com/F9y4ng/GreasyFork-Scripts/raw/master/Google%20%26%20Baidu%20Switcher.user.js" target="_blank">搜索助手（电脑）</a>

</main>

<footer>Powered by GitHub Pages</footer>

<div id="toast"><i data-lucide="check-circle" color="var(--success)"></i><span>链接已复制</span></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
/* 初始化图标 */
lucide.createIcons();

/* 主题切换 */
const toggle=document.getElementById('themeToggle');
const html=document.documentElement;
toggle.onclick=()=>{
  html.classList.toggle('dark');
  toggle.textContent=html.classList.contains('dark')?'☼':'☾';
};

/* 复制按钮 */
document.querySelectorAll('.btn.copy').forEach(btn=>{
  btn.onclick=()=>{
    const link=btn.dataset.link;
    navigator.clipboard.writeText(link).then(()=>{
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),2000);
    });
  };
});

/* 搜索过滤 */
const searchBox=document.getElementById('searchBox');
const container=document.getElementById('container');
searchBox.addEventListener('input',()=>{
  const kw=searchBox.value.toLowerCase();
  container.querySelectorAll('section').forEach(sec=>{
    const txt=sec.textContent.toLowerCase();
    sec.style.display=txt.includes(kw)?'':'none';
  });
});

/* 入场动画 */
window.addEventListener('load',()=>document.body.style.opacity=1);
</script>
</body>
</html>
